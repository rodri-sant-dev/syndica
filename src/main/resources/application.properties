spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.stop.command=stop

storage.endpoint=https://${STORAGE_NAMESPACE}.compat.objectstorage.${STORAGE_REGION}.oraclecloud.com
storage.region=${STORAGE_REGION}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.bucket-name=${STORAGE_BUCKET}

# -----------------------my configs------------------------
cpf.encription-key=${CPF_ENCRYPTION_KEY}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=5m
jwt.refresh-token-expiration=1h
